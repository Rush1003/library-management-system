# =========================================================
# Library Management System - Backend Configuration
# =========================================================

# --- Server ---
server.port=8080

# --- MongoDB connection ---
# For local MongoDB installation:
spring.data.mongodb.uri=mongodb://localhost:27017/library_management_db
# If using MongoDB Atlas instead, comment the line above and use:
# spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster-url>/library_management_db?retryWrites=true&w=majority

# --- Jackson (JSON) ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Logging ---
logging.level.root=INFO
logging.level.com.library.lms=DEBUG
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN

# --- Actuator (used for health-check based fallback / monitoring) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- Business rules ---
library.loan.default-period-days=14
library.loan.fine-per-day=0.50
